version: "3.9"

services:
  # ── Flask RAG Backend ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_chatbot_backend
    ports:
      - "5000:5000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    env_file:
      - ./backend/.env
    volumes:
      # Persist FAISS index cache so it survives container restarts
      - rag_index_cache:/app
    restart: unless-stopped
    networks:
      - rag_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s   # Allow time for initial index build

  # ── Nginx Frontend ─────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: rag_chatbot_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag_network

volumes:
  rag_index_cache:
    driver: local

networks:
  rag_network:
    driver: bridge
